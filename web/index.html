<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LMLG - BitsxLaMarató 2025">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LMLG - BitsxLaMarató 2025">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LMLG - BitsxLaMarató 2025</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background: #1E2124;
    }
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1E2124;
      z-index: 9999;
      transition: opacity .4s ease;
    }
    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: .04em;
      margin-bottom: .4rem;
    }
    .loading-title span {
      color: #7289DA;
    }
    .loading-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: .85rem;
      color: rgba(255,255,255,.5);
      margin-bottom: 2rem;
      letter-spacing: .08em;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(114,137,218,.25);
      border-top-color: #7289DA;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: light) {
      body { background: #F3F6FB; }
      .loading-screen { background: #F3F6FB; }
      .loading-title { color: #0F172A; }
      .loading-title span { color: #1D70B8; }
      .loading-sub { color: rgba(15,23,42,.45); }
      .spinner {
        border-color: rgba(29,112,184,.2);
        border-top-color: #1D70B8;
      }
    }
  </style>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="loading-title">Neuro<span>Sight</span></div>
    <div class="loading-sub">BitsxLaMarató 2025</div>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: '{{flutter_service_worker_version}}',
        },
      }).then(function() {
        var el = document.getElementById('loading');
        if (el) {
          el.classList.add('fade-out');
          setTimeout(function() { el.remove(); }, 400);
        }
      });
    });
  </script>
</body>
</html>
